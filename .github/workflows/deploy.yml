name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't pile up deploys.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy api (Fly.io)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy api / worker / triggers
        run: flyctl deploy --config infra/fly/api.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    # The Vercel side runs in parallel — Vercel watches the GitHub repo and
    # auto-deploys on push to main. This job exists as a manual hook in case
    # we ever want to deploy via flyctl instead.
    if: false  # toggled on if/when we move web off Vercel.
    name: Deploy web (Vercel — disabled; auto-handled)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Web is auto-deployed by Vercel's GitHub integration."
