name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime
        run: pnpm --filter runtime build

      - name: Build evals
        run: pnpm --filter evals build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Build api
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build
        env:
          # Clerk requires a publishable key at build time even for prerender.
          # A dummy pk_test value is fine; runtime uses the real one from Fly
          # / Vercel secrets.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy_build_only_not_a_real_key
