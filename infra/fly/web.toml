# Fly.io config for the Next.js web app.
# Use this only if you prefer Fly over Vercel — Vercel auto-deploys Next.js
# from your GitHub repo with zero config, which is the recommended path.

app = "REPLACE_WITH_FLY_WEB_APP_NAME"
primary_region = "yyz"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "packages/web/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/"
  protocol = "http"
  timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
